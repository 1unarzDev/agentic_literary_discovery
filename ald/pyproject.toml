[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ald"
version = "0.1.0"
description = "Worker client for the agentic literary discovery distributed passage-labeling system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "psutil>=5.9",
    "platformdirs>=4.2",
    "jsonschema>=4.21",
    "rapidfuzz>=3.6",
    "rich>=13.7",
]

[project.scripts]
ald = "ald.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ald"]

[tool.hatch.build.targets.sdist]
include = ["src/ald", "tests", "install", "pyproject.toml", "README*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
